services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: travelrisk
      POSTGRES_PASSWORD: travelrisk
      POSTGRES_DB: travelrisk
    ports: ["5433:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U travelrisk"]
      interval: 2s
      retries: 20
    volumes: [pgdata:/var/lib/postgresql/data]

  api:
    build: .
    environment:
      TRA_DATABASE_URL: postgresql+psycopg://travelrisk:travelrisk@db:5432/travelrisk
      TRA_OPERATOR_API_KEY: dev-operator-key
    ports: ["8000:8000"]
    depends_on:
      db: { condition: service_healthy }

volumes:
  pgdata:
