AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  Travel Risk Agent: ECS Fargate API behind an ALB, served over HTTPS by CloudFront,
  RDS PostgreSQL 17, secrets in Secrets Manager, EventBridge schedules for sync, digest and purge.
  Uses the default VPC's public subnets (no NAT gateway) to keep the demo cheap.

Parameters:
  ImageUri:
    Type: String
    Description: ECR image URI with tag (infra/deploy.sh fills this in).
  VpcId:
    Type: AWS::EC2::VPC::Id
  SubnetIds:
    Type: List<AWS::EC2::Subnet::Id>
    Description: At least two public subnets in different availability zones.
  CloudFrontPrefixListId:
    Type: String
    Description: Managed prefix list com.amazonaws.global.cloudfront.origin-facing (deploy.sh looks it up).
  OperatorApiKey:
    Type: String
    NoEcho: true
    MinLength: 24
    Description: Key for operator endpoints; EventBridge sends it when calling the API.
  AnthropicApiKey:
    Type: String
    NoEcho: true
    Default: ""
    Description: Leave empty to run with the offline heuristic baseline.
  SesFromEmail:
    Type: String
    Default: ""
    Description: Verified SES sender address. Empty = email organisations use the log channel.
  DbInstanceClass:
    Type: String
    Default: db.t4g.micro

Conditions:
  HasAnthropicKey: !Not [!Equals [!Ref AnthropicApiKey, ""]]

Resources:
  # ---------- Secrets ----------
  OperatorKeySecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Description: Travel Risk Agent operator API key
      SecretString: !Ref OperatorApiKey

  AnthropicKeySecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Description: Anthropic API key for the Claude model provider
      SecretString: !If [HasAnthropicKey, !Ref AnthropicApiKey, "unset"]

  # ---------- Network security ----------
  AlbSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: ALB reachable only from CloudFront
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          SourcePrefixListId: !Ref CloudFrontPrefixListId

  ServiceSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: API tasks reachable only from the ALB
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 8000
          ToPort: 8000
          SourceSecurityGroupId: !Ref AlbSecurityGroup

  DbSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: PostgreSQL reachable only from the API tasks
      VpcId: !Ref VpcId
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 5432
          ToPort: 5432
          SourceSecurityGroupId: !Ref ServiceSecurityGroup

  # ---------- Database ----------
  DbSubnetGroup:
    Type: AWS::RDS::DBSubnetGroup
    Properties:
      DBSubnetGroupDescription: Travel Risk Agent database subnets
      SubnetIds: !Ref SubnetIds

  Database:
    Type: AWS::RDS::DBInstance
    DeletionPolicy: Snapshot
    UpdateReplacePolicy: Snapshot
    Properties:
      Engine: postgres
      EngineVersion: "17.11"
      DBInstanceClass: !Ref DbInstanceClass
      AllocatedStorage: "20"
      StorageType: gp3
      StorageEncrypted: true
      DBName: travelrisk
      MasterUsername: travelrisk
      ManageMasterUserPassword: true
      PubliclyAccessible: false
      DBSubnetGroupName: !Ref DbSubnetGroup
      VPCSecurityGroups: [!Ref DbSecurityGroup]
      BackupRetentionPeriod: 1
      MultiAZ: false

  # ---------- Load balancer ----------
  LoadBalancer:
    Type: AWS::ElasticLoadBalancingV2::LoadBalancer
    Properties:
      Scheme: internet-facing
      Subnets: !Ref SubnetIds
      SecurityGroups: [!Ref AlbSecurityGroup]
      LoadBalancerAttributes:
        - Key: idle_timeout.timeout_seconds
          Value: "120"

  TargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      VpcId: !Ref VpcId
      Protocol: HTTP
      Port: 8000
      TargetType: ip
      HealthCheckPath: /health
      HealthCheckIntervalSeconds: 15
      HealthyThresholdCount: 2

  Listener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      LoadBalancerArn: !Ref LoadBalancer
      Protocol: HTTP
      Port: 80
      DefaultActions:
        - Type: forward
          TargetGroupArn: !Ref TargetGroup

  # ---------- HTTPS without a custom domain ----------
  Distribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        Comment: Travel Risk Agent
        PriceClass: PriceClass_100
        Origins:
          - Id: alb
            DomainName: !GetAtt LoadBalancer.DNSName
            CustomOriginConfig:
              OriginProtocolPolicy: http-only
              OriginReadTimeout: 60
        DefaultCacheBehavior:
          TargetOriginId: alb
          ViewerProtocolPolicy: redirect-to-https
          AllowedMethods: [GET, HEAD, OPTIONS, PUT, PATCH, POST, DELETE]
          CachedMethods: [GET, HEAD]
          CachePolicyId: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad # Managed-CachingDisabled
          OriginRequestPolicyId: b689b0a8-53d0-40ab-baf2-68738e2966ac # Managed-AllViewerExceptHostHeader

  # ---------- ECS ----------
  Cluster:
    Type: AWS::ECS::Cluster

  LogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      RetentionInDays: 14

  ExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: {Service: ecs-tasks.amazonaws.com}
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AmazonECSTaskExecutionRolePolicy
      Policies:
        - PolicyName: read-secrets
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: secretsmanager:GetSecretValue
                Resource:
                  - !Ref OperatorKeySecret
                  - !Ref AnthropicKeySecret
                  - !GetAtt Database.MasterUserSecret.SecretArn

  TaskRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: {Service: ecs-tasks.amazonaws.com}
            Action: sts:AssumeRole
      Policies:
        - PolicyName: send-email
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: ses:SendEmail
                Resource: "*"

  TaskDefinition:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: travel-risk-agent
      RequiresCompatibilities: [FARGATE]
      NetworkMode: awsvpc
      Cpu: "512"
      Memory: "1024"
      RuntimePlatform:
        CpuArchitecture: X86_64
        OperatingSystemFamily: LINUX
      ExecutionRoleArn: !GetAtt ExecutionRole.Arn
      TaskRoleArn: !GetAtt TaskRole.Arn
      ContainerDefinitions:
        - Name: api
          Image: !Ref ImageUri
          Essential: true
          PortMappings: [{ContainerPort: 8000}]
          Environment:
            - {Name: TRA_DB_HOST, Value: !GetAtt Database.Endpoint.Address}
            - {Name: TRA_MODEL_PROVIDER, Value: !If [HasAnthropicKey, claude, heuristic]}
            - {Name: TRA_SES_FROM_EMAIL, Value: !Ref SesFromEmail}
            - {Name: TRA_AWS_REGION, Value: !Ref AWS::Region}
          Secrets:
            - Name: TRA_DB_PASSWORD
              ValueFrom: !Sub "${Database.MasterUserSecret.SecretArn}:password::"
            - {Name: TRA_OPERATOR_API_KEY, ValueFrom: !Ref OperatorKeySecret}
            - {Name: ANTHROPIC_API_KEY, ValueFrom: !Ref AnthropicKeySecret}
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref LogGroup
              awslogs-region: !Ref AWS::Region
              awslogs-stream-prefix: api

  Service:
    Type: AWS::ECS::Service
    DependsOn: Listener
    Properties:
      Cluster: !Ref Cluster
      LaunchType: FARGATE
      DesiredCount: 1 # one task: migrations run at start-up
      TaskDefinition: !Ref TaskDefinition
      HealthCheckGracePeriodSeconds: 60
      NetworkConfiguration:
        AwsvpcConfiguration:
          AssignPublicIp: ENABLED # public subnets, no NAT: needed to pull the image and reach feeds
          Subnets: !Ref SubnetIds
          SecurityGroups: [!Ref ServiceSecurityGroup]
      LoadBalancers:
        - ContainerName: api
          ContainerPort: 8000
          TargetGroupArn: !Ref TargetGroup

  # ---------- Schedules (EventBridge -> HTTPS API with the operator key) ----------
  ApiConnection:
    Type: AWS::Events::Connection
    Properties:
      AuthorizationType: API_KEY
      AuthParameters:
        ApiKeyAuthParameters:
          ApiKeyName: X-API-Key
          ApiKeyValue: !Ref OperatorApiKey

  SyncDestination:
    Type: AWS::Events::ApiDestination
    Properties:
      ConnectionArn: !GetAtt ApiConnection.Arn
      HttpMethod: POST
      InvocationEndpoint: !Sub "https://${Distribution.DomainName}/v1/advisories/sync?wait=false"
      InvocationRateLimitPerSecond: 1

  DigestDestination:
    Type: AWS::Events::ApiDestination
    Properties:
      ConnectionArn: !GetAtt ApiConnection.Arn
      HttpMethod: POST
      InvocationEndpoint: !Sub "https://${Distribution.DomainName}/v1/digests/send"
      InvocationRateLimitPerSecond: 1

  PurgeDestination:
    Type: AWS::Events::ApiDestination
    Properties:
      ConnectionArn: !GetAtt ApiConnection.Arn
      HttpMethod: POST
      InvocationEndpoint: !Sub "https://${Distribution.DomainName}/v1/maintenance/purge"
      InvocationRateLimitPerSecond: 1

  SchedulerRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: {Service: events.amazonaws.com}
            Action: sts:AssumeRole
      Policies:
        - PolicyName: invoke-api
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: events:InvokeApiDestination
                Resource:
                  - !GetAtt SyncDestination.Arn
                  - !GetAtt DigestDestination.Arn
                  - !GetAtt PurgeDestination.Arn

  SyncRule:
    Type: AWS::Events::Rule
    Properties:
      Description: Poll advisory feeds every 30 minutes
      ScheduleExpression: rate(30 minutes)
      Targets:
        - Id: sync
          Arn: !GetAtt SyncDestination.Arn
          RoleArn: !GetAtt SchedulerRole.Arn
          RetryPolicy: {MaximumRetryAttempts: 0}

  DigestRule:
    Type: AWS::Events::Rule
    Properties:
      Description: Daily low-severity digest at 08:00 UTC
      ScheduleExpression: cron(0 8 * * ? *)
      Targets:
        - Id: digest
          Arn: !GetAtt DigestDestination.Arn
          RoleArn: !GetAtt SchedulerRole.Arn
          RetryPolicy: {MaximumRetryAttempts: 0}

  PurgeRule:
    Type: AWS::Events::Rule
    Properties:
      Description: Delete trips 30 days after they end (GDPR)
      ScheduleExpression: cron(0 3 * * ? *)
      Targets:
        - Id: purge
          Arn: !GetAtt PurgeDestination.Arn
          RoleArn: !GetAtt SchedulerRole.Arn

Outputs:
  Url:
    Description: HTTPS URL for the API, docs and review page
    Value: !Sub "https://${Distribution.DomainName}"
  ReviewPage:
    Value: !Sub "https://${Distribution.DomainName}/ui"
  LogGroupName:
    Value: !Ref LogGroup
  ClusterName:
    Value: !Ref Cluster
  ServiceName:
    Value: !GetAtt Service.Name
  TaskDefinitionArn:
    Value: !Ref TaskDefinition
  SubnetIds:
    Value: !Join [",", !Ref SubnetIds]
  ServiceSecurityGroupId:
    Value: !Ref ServiceSecurityGroup
