# Travel Risk Agent eval set. Labels follow docs/SEVERITY_RUBRIC.md: each scenario asks whether
# THIS advisory affects THIS trip.
#
# advisory:
#   {from: us, country: XX}      real US State Dept text, from tests/fixtures/us_state_feed.xml
#   {from: uk, page: <slug>}     real UK FCDO text, from tests/fixtures/uk_<slug>.json
#   {synthetic: {...}}           written for this eval; never shown to anyone as real advice
# trip: raw values as a customer would type them; start/end are days relative to the run date.
# other_level: the other government's level; auto-filled from fixtures when omitted.
#
# label_status: draft = written by the author from the advisory text, not yet checked by a
# second person. Real advisories change: these labels describe the 17 Nov 2026 snapshots.

