name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      db:
        image: postgres:17.12
        env:
          POSTGRES_USER: travelrisk
          POSTGRES_PASSWORD: travelrisk
          POSTGRES_DB: travelrisk
        ports: ["5433:5432"]
        options: >-
          --health-cmd "pg_isready -U travelrisk"
          --health-interval 2s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run alembic upgrade head
      - run: uv run pytest -q
      # Week 4: eval job runs here on prompt/model changes and fails the build if recall drops.
